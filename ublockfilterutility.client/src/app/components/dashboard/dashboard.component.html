<ng-template appModal [isOpen]="isLoading()" [options]="{backdrop: 'static', class:'modal-fullscreen opacity-50'}">
    <div class="d-flex h-100 justify-content-center align-items-center">
        <fa-icon [icon]="faSpinner" [animation]="'spin'"></fa-icon>
    </div>
</ng-template>
<div class="container h-100 d-flex flex-column">
    <div class="row">
        <div class="col">
            <div class="d-flex align-items-center">
                <h4 class="flex-fill m-0 p-0">uBlock Filter Utility</h4>
                <div>
                    <div class="form-check form-switch">
                        @let overrideSwitchId = idGenerator$ | async;
                        <input type="checkbox" role="switch" class="form-check-input" id="{{overrideSwitchId}}" 
                            [ngModel]="overrideOsThemeEnabled()" (ngModelChange)="themeService.setOverrideOsTheme($event)" />
                        <label for="{{overrideSwitchId}}">Override OS Theme</label>
                    </div>
                        <div class="form-check form-switch">
                        @let themeSwitchId = idGenerator$ | async;
                        <input type="checkbox" role="switch" class="form-check-input"
                            id="{{themeSwitchId}}" [ngModel]="darkModeEnabled()" (ngModelChange)="themeService.setDarkMode($event)" 
                            [disabled]="!overrideOsThemeEnabled()" />
                        <label for="{{themeSwitchId}}" [ngClass]="{'text-secondary': !overrideOsThemeEnabled()}">Dark Mode</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <hr />
    <div class="row flex-fill">
        <div class="col-3 border-end d-flex flex-column">
            <div class="d-flex gap-1 justify-content-end align-items-center">
                <a class="btn btn-secondary btn-sm" [href]="exportUrl" download="filters.txt"
                    title="Export Filters" role="button" [ngClass]="{'disabled': isLoading() || isEditing()}">
                    <fa-icon [icon]="faFileExport"></fa-icon>
                </a>
                <button type="button" class="btn btn-sm btn-primary" (click)="handleAdd()" [disabled]="isLoading() || isEditing()"
                    title="Add Filter">
                    <fa-icon [icon]="faPlus"></fa-icon>
                </button>
            </div>
            <hr />
            <div class="form-floating">
                @let selFiltersId = idGenerator$ | async;
                <select class="form-select" id="{{selFiltersId}}" [(ngModel)]="selectedFilter" [disabled]="isLoading() || isEditing()">
                    <option [ngValue]="null">Select a filter</option>
                    @for (filter of filters$ | async; track filter.Id)
                    {
                        <option [ngValue]="filter">{{filter.Name}}</option>
                    }
                </select>
                <label for="{{selFiltersId}}">Filters</label>
            </div>
        </div>
        <div class="col d-flex flex-column" [ngClass]="{'d-none': !selectedFilter()}">
            <div class="flex-grow-1">
                <ng-container #filterContainer></ng-container>
            </div>
            <hr />
            <div class="d-flex gap-1 justify-content-end">
                @if (!isEditing()) {
                    <button type="button" class="btn btn-info" (click)="handlePreview()" [disabled]="isLoading()"
                        title="View Filter">
                        <fa-icon [icon]="faEye"></fa-icon>
                    </button>
                    <button type="button" class="btn btn-secondary" (click)="handleCopy()" [disabled]="isLoading()"
                        title="Copy Filter">
                        <fa-icon [icon]="faCopy"></fa-icon>
                    </button>
                }
                @if (isEditing()) {
                    <button type="button" class="btn btn-primary" (click)="handleUpdate()" title="Save Filter"
                        [disabled]="isLoading() || !canSave()">
                        <fa-icon [icon]="faSave"></fa-icon>
                    </button>
                    <button type="button" class="btn btn-danger" (click)="handleUndo()" title="Undo Changes"
                        [disabled]="isLoading()">
                        <fa-icon [icon]="faUndo"></fa-icon>
                    </button>
                }
                @if (!isEditing()) {
                    <button type="button" class="btn btn-danger" (click)="handleDelete()" [disabled]="isLoading()"
                        title="Delete Filter">
                        <fa-icon [icon]="faTrash"></fa-icon>
                    </button>
                }
            </div>
        </div>
    </div>
    <hr />
</div>
