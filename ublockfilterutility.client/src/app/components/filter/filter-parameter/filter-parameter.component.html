<div class="input-group w-auto">
    <div class="input-group-text fw-bold">{{param?.key}}</div>
    <button type="button" class="btn btn-sm btn-info" (click)="handlePreview()">
        <fa-icon [icon]="faEye"></fa-icon>
    </button>
    <button type="button" class="btn btn-sm btn-secondary" (click)="handleEdit()">
        <fa-icon [icon]="faPencil"></fa-icon>
    </button>
    <button type="button" class="btn btn-sm btn-danger" (click)="handleRemove()">
        <fa-icon [icon]="faTrash"></fa-icon>
    </button>
</div>
